services:
  postgres:
    image: postgres:15
    container_name: agent-feed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_feed
    ports:
      # 55432 on the host, so this never collides with a Postgres you already run.
      - '55432:5432'
    volumes:
      - agent-feed-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d agent_feed']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  agent-feed-pgdata:
